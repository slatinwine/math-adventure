<style>
  :root{--bg:#f7f5ef;--ink:#2c2620;--ink-soft:#8a7f70;--gold:#b8862a;--gold-soft:#e9d9b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font-family:"Songti SC","Noto Serif SC",STSong,serif;
    overflow:hidden;
  }
  /* 数字符氛围层 */
  .floats{position:fixed;inset:0;pointer-events:none;z-index:0}
  .floats span{
    position:absolute;font-size:26px;color:var(--gold);opacity:.07;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(105vh) rotate(0deg)}
    100%{transform:translateY(-15vh) rotate(360deg)}
  }
  .stage{position:relative;z-index:1;text-align:center;padding:32px;max-width:640px}
  .aleph{
    font-size:72px;line-height:1;color:var(--gold);
    text-shadow:0 0 24px rgba(184,134,42,.25);
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  h1{font-size:34px;margin:18px 0 10px;letter-spacing:.12em}
  .sub{font-size:14.5px;color:var(--ink-soft);line-height:1.8}
  .go{margin:34px 0 14px;font-size:15px}
  .go b{color:var(--gold)}
  .bar{
    width:220px;height:3px;margin:0 auto 26px;
    background:var(--gold-soft);border-radius:2px;overflow:hidden;
  }
  .bar i{display:block;height:100%;width:0;background:var(--gold);animation:fill 5s linear forwards}
  @keyframes fill{to{width:100%}}
  .btn{
    display:inline-block;padding:11px 30px;border-radius:999px;
    background:var(--gold);color:#fff;text-decoration:none;font-size:15px;letter-spacing:.08em;
    box-shadow:0 4px 14px rgba(184,134,42,.3);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(184,134,42,.4)}
  .tip{margin-top:26px;font-size:12.5px;color:var(--ink-soft)}
</style>
</head>
<body>
  <div class="floats" id="floats"></div>
  <div class="stage">

  </div>
<script>
(function(){
  var OFFICIAL = 'https://math-adventure-95023.app.workbuddy.host/?sharecode=2Q4RSLNNW4';
  document.getElementById('enter').href = OFFICIAL;
  var left = 5, tEl = document.getElementById('t');
  var timer = setInterval(function(){
    left--;
    if(left <= 0){ clearInterval(timer); location.replace(OFFICIAL); }
    else tEl.textContent = left;
  }, 1000);
  // 数字符氛围

  var chars = ['ℵ','π','∞','∑','∮','√','λ','Δ','∇','∈','⊕','⊗','∫','ℝ','φ','θ'];
  for(var i=0;i<16;i++){
    var s = document.createElement('span');
    s.textContent = chars[i % chars.length];
    s.style.left = (Math.random()*96+2) + '%';
    s.style.animationDuration = (14+Math.random()*16) + 's';
    s.style.animationDelay = (-Math.random()*20) + 's';
    s.style.fontSize = (16+Math.random()*24) + 'px';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
